<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="loading">Game Tuổi Thơ - Đang chơi game</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Đang chơi game Java cổ điển trên Game Tuổi Thơ. Trải nghiệm game di động kinh điển ngay trên trình duyệt." data-i18n-meta="siteDescription" />
    <meta name="robots" content="noindex, nofollow" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Chơi Game - Game Tuổi Thơ" />
    <meta property="og:type" content="website" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />
</head>
<style>
    :root {
        /* Light theme colors (default) */
        --bg-primary: #f5f3ff;
        --bg-gradient-start: #667eea;
        --bg-gradient-end: #764ba2;
        --bg-pattern-opacity: 0.03;
        --text-primary: #2a1a4e;
        --text-secondary: #5a4a7e;
        --header-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --panel-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(248, 246, 255, 0.95));
        --panel-text: #2a1a4e;
        --panel-secondary-text: #5a4a7e;
        --loading-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --shadow-color: rgba(102, 126, 234, 0.15);
        --border-color: rgba(102, 126, 234, 0.15);
        --accent-purple: #667eea;
        --accent-violet: #764ba2;
    }
    
    body.dark-theme {
        /* Dark theme colors */
        --bg-primary: #0a0a15;
        --bg-gradient-start: #1a1a3e;
        --bg-gradient-end: #2a2a4e;
        --bg-pattern-opacity: 0.05;
        --text-primary: #e8e6f0;
        --text-secondary: #b8b6c8;
        --header-bg: linear-gradient(135deg, #1a1a3e 0%, #2a2a4e 100%);
        --panel-bg: linear-gradient(145deg, rgba(26, 26, 46, 0.98), rgba(18, 18, 36, 0.95));
        --panel-text: #e8e6f0;
        --panel-secondary-text: #b8b6c8;
        --loading-bg: linear-gradient(135deg, #1a1a3e 0%, #2a2a4e 100%);
        --shadow-color: rgba(0, 0, 0, 0.3);
        --border-color: rgba(102, 126, 234, 0.2);
        --accent-purple: #8892ea;
        --accent-violet: #9878c2;
    }
    
    html, body {
        height: 100%;
    }
    body {
        margin: 0;
        padding: 0;
        font-family: sans;
        transition: all 0.5s ease;
    }
    #screen-area {
        background: 
            radial-gradient(circle at 20% 50%, var(--bg-gradient-start) 0%, transparent 50%),
            radial-gradient(circle at 80% 80%, var(--bg-gradient-end) 0%, transparent 50%),
            repeating-linear-gradient(45deg, 
                rgba(102, 126, 234, var(--bg-pattern-opacity)) 0px, 
                rgba(102, 126, 234, var(--bg-pattern-opacity)) 2px,
                transparent 2px, 
                transparent 12px
            ),
            linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-primary) 100%);
        background-color: var(--bg-primary);
        background-attachment: fixed;
        position: absolute;
        top: 45px;
        left: 320px;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.5s ease;
    }
    
    #game-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 45px;
        background: var(--header-bg);
        box-shadow: 0 2px 10px var(--shadow-color);
        display: flex;
        align-items: center;
        padding: 0 15px;
        z-index: 1000;
        transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    
    #game-title {
        color: var(--text-primary);
        font-size: 1.2em;
        font-weight: bold;
        margin: 0;
        text-shadow: 0 2px 4px var(--shadow-color);
        flex-grow: 1;
        transition: color 0.3s ease;
    }
    
    #back-btn {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9em;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        margin-right: 8px;
        box-shadow: 
            4px 4px 8px rgba(0, 0, 0, 0.2),
            -2px -2px 6px rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
    }
    
    #back-btn::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition: width 0.5s, height 0.5s;
    }
    
    #back-btn:hover::before {
        width: 200px;
        height: 200px;
    }
    
    #back-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: translateY(-2px);
        box-shadow: 
            6px 6px 12px rgba(0, 0, 0, 0.3),
            -3px -3px 8px rgba(255, 255, 255, 0.15);
    }
    
    #back-btn:active {
        transform: translateY(0);
        box-shadow: 
            inset 2px 2px 4px rgba(0, 0, 0, 0.3),
            inset -1px -1px 2px rgba(255, 255, 255, 0.1);
    }
    
    .theme-toggle-run {
        background: rgba(255, 255, 255, 0.15);
        border: 2px solid rgba(255, 255, 255, 0.25);
        color: white;
        padding: 6px 12px;
        border-radius: 50px;
        cursor: pointer;
        font-size: 1em;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        gap: 4px;
        box-shadow: 
            4px 4px 8px rgba(0, 0, 0, 0.2),
            -2px -2px 6px rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
    }
    
    .theme-toggle-run::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s;
    }
    
    .theme-toggle-run:hover::before {
        left: 100%;
    }
    
    .theme-toggle-run:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: scale(1.08) translateY(-2px);
        box-shadow: 
            6px 6px 12px rgba(0, 0, 0, 0.3),
            -3px -3px 8px rgba(255, 255, 255, 0.15);
    }
    
    .theme-toggle-run:active {
        transform: scale(1.02) translateY(0);
        box-shadow: 
            inset 2px 2px 4px rgba(0, 0, 0, 0.3),
            inset -1px -1px 2px rgba(255, 255, 255, 0.1);
    }
    
    .theme-toggle-run span {
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .theme-toggle-run:hover span {
        transform: rotate(20deg) scale(1.15);
    }
    
    #game-info-panel {
        position: fixed;
        top: 45px;
        left: 0;
        width: 320px;
        max-height: calc(100vh - 45px);
        background: var(--panel-bg);
        box-shadow: 2px 0 10px var(--shadow-color);
        overflow-y: auto;
        z-index: 998;
        transition: background 0.3s ease, box-shadow 0.3s ease;
        border-right: 1px solid var(--border-color);
    }
    
    .game-info-header {
        background: var(--header-bg);
        padding: 20px;
        color: var(--text-primary);
        transition: background 0.3s ease, color 0.3s ease;
    }
    
    .game-info-header h2 {
        margin: 0 0 10px 0;
        font-size: 1.4em;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }
    
    .game-info-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
    }
    
    .game-info-tag {
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(10px);
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.8em;
        font-weight: 500;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    .game-info-body {
        padding: 20px;
        color: var(--panel-text);
        transition: color 0.3s ease;
    }
    
    .game-info-section {
        margin-bottom: 18px;
    }
    
    .game-info-section h3 {
        color: var(--accent-purple);
        font-size: 1.1em;
        margin: 0 0 8px 0;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    
    .game-info-section p {
        color: var(--panel-secondary-text);
        line-height: 1.6;
        margin: 0;
        text-align: justify;
        font-size: 0.9em;
        transition: color 0.3s ease;
    }
    
    .game-info-meta {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 15px;
        background: rgba(102, 126, 234, 0.1);
        border-radius: 12px;
        margin-bottom: 18px;
    }
    
    .game-info-meta-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85em;
        color: var(--panel-secondary-text);
        transition: color 0.3s ease;
    }
    
    .game-info-meta-item strong {
        color: var(--panel-text);
        transition: color 0.3s ease;
    }
    
    #game-info-modal {
        display: none;
    }
    
    #controls-panel {
        position: fixed;
        top: 45px;
        right: 0;
        width: 280px;
        max-height: calc(100vh - 45px);
        background: var(--panel-bg);
        box-shadow: 
            -8px 0 16px rgba(0, 0, 0, 0.2),
            8px 0 16px rgba(255, 255, 255, 0.05);
        padding: 24px;
        overflow-y: auto;
        z-index: 999;
        transform: translateX(100%);
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease, box-shadow 0.3s ease;
        color: var(--panel-text);
        border-left: 1px solid var(--border-color);
    }
    
    body.dark-theme #controls-panel {
        box-shadow: 
            -8px 0 16px rgba(0, 0, 0, 0.5),
            8px 0 16px rgba(255, 255, 255, 0.02);
    }
    
    #controls-panel.show {
        transform: translateX(0);
    }
    
    #controls-toggle {
        position: fixed;
        top: 52px;
        right: 10px;
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.95), rgba(118, 75, 162, 0.95));
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 8px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9em;
        z-index: 1001;
        box-shadow: 
            6px 6px 12px rgba(0, 0, 0, 0.3),
            -2px -2px 6px rgba(255, 255, 255, 0.1);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
    }
    
    #controls-toggle::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        transition: left 0.5s;
    }
    
    #controls-toggle:hover::before {
        left: 100%;
    }
    
    #controls-toggle:hover {
        background: linear-gradient(135deg, rgba(102, 126, 234, 1), rgba(118, 75, 162, 1));
        transform: translateY(-2px) scale(1.03);
        box-shadow: 
            8px 8px 16px rgba(0, 0, 0, 0.4),
            -3px -3px 8px rgba(255, 255, 255, 0.15);
    }
    
    #controls-toggle:active {
        transform: translateY(0) scale(1);
        box-shadow: 
            inset 3px 3px 6px rgba(0, 0, 0, 0.4),
            inset -1px -1px 2px rgba(255, 255, 255, 0.1);
    }
    
    .control-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        transition: all 0.2s ease;
    }
    
    body.dark-theme .control-item {
        border-bottom-color: rgba(255, 255, 255, 0.1);
    }
    
    .control-item:hover {
        padding-left: 8px;
        background: rgba(102, 126, 234, 0.05);
        border-radius: 8px;
        margin: 0 -8px;
        padding-right: 8px;
    }
    
    .control-item:last-child {
        border-bottom: none;
    }

    .control-key {
        background: linear-gradient(145deg, #f8f8f8, #e8e8e8);
        padding: 6px 12px;
        border-radius: 8px;
        font-family: 'Courier New', monospace;
        font-size: 0.9em;
        font-weight: bold;
        border: 1px solid #d0d0d0;
        box-shadow: 
            3px 3px 6px rgba(0, 0, 0, 0.15),
            -2px -2px 4px rgba(255, 255, 255, 0.9),
            inset 0 -2px 0 rgba(0, 0, 0, 0.1);
        color: #333;
        transition: all 0.2s ease;
    }
    
    body.dark-theme .control-key {
        background: linear-gradient(145deg, #3a3a3a, #2a2a2a);
        border-color: #555;
        color: #e0e0e0;
        box-shadow: 
            3px 3px 6px rgba(0, 0, 0, 0.5),
            -2px -2px 4px rgba(255, 255, 255, 0.05),
            inset 0 -2px 0 rgba(0, 0, 0, 0.3);
    }
    
    .control-item:hover .control-key {
        transform: translateY(-1px);
        box-shadow: 
            4px 4px 8px rgba(0, 0, 0, 0.2),
            -3px -3px 6px rgba(255, 255, 255, 1),
            inset 0 -2px 0 rgba(0, 0, 0, 0.15);
    }    .control-label {
        color: var(--panel-secondary-text);
        font-size: 0.9em;
        transition: color 0.3s ease;
    }
    
    .controls-title {
        font-size: 1.1em;
        font-weight: bold;
        margin-bottom: 15px;
        color: var(--panel-text);
        transition: color 0.3s ease;
    }
    #display {
        background-color: white;
        zoom: 1;
        image-rendering: pixelated; /* affects zoom */
    }
    #display:focus {
        outline: none;
    }
    
    #game-crash-notice {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, 
            rgba(255, 87, 34, 0.95) 0%,
            rgba(244, 67, 54, 0.95) 100%
        );
        color: white;
        padding: 12px 24px;
        border-radius: 50px;
        font-size: 0.85em;
        font-weight: 600;
        box-shadow: 
            0 8px 24px rgba(255, 87, 34, 0.4),
            0 4px 12px rgba(0, 0, 0, 0.3),
            inset 0 1px 2px rgba(255, 255, 255, 0.3);
        z-index: 1002;
        display: none;
        animation: slideUpNotice 0.5s ease-out, noticeGlow 2s ease-in-out infinite;
        border: 2px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(10px);
    }
    
    body.dark-theme #game-crash-notice {
        background: linear-gradient(135deg, 
            rgba(255, 87, 34, 0.9) 0%,
            rgba(244, 67, 54, 0.9) 100%
        );
        box-shadow: 
            0 8px 24px rgba(255, 87, 34, 0.5),
            0 4px 12px rgba(0, 0, 0, 0.5),
            inset 0 1px 2px rgba(255, 255, 255, 0.2);
    }
    
    @keyframes slideUpNotice {
        from {
            transform: translateX(-50%) translateY(100px);
            opacity: 0;
        }
        to {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    }
    
    @keyframes noticeGlow {
        0%, 100% {
            box-shadow: 
                0 8px 24px rgba(255, 87, 34, 0.4),
                0 4px 12px rgba(0, 0, 0, 0.3),
                inset 0 1px 2px rgba(255, 255, 255, 0.3);
        }
        50% {
            box-shadow: 
                0 12px 32px rgba(255, 87, 34, 0.6),
                0 6px 16px rgba(0, 0, 0, 0.4),
                inset 0 1px 3px rgba(255, 255, 255, 0.4);
        }
    }
    
    #game-crash-notice.show {
        display: block;
    }
    
    #game-crash-notice .notice-icon {
        display: inline-block;
        animation: rotateIcon 2s linear infinite;
        margin-right: 8px;
    }
    
    @keyframes rotateIcon {
        0%, 90%, 100% {
            transform: rotate(0deg);
        }
        95% {
            transform: rotate(-10deg);
        }
    }
    #loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(248, 246, 255, 0.95));
        padding: 50px 60px;
        border-radius: 30px;
        box-shadow: 
            12px 12px 24px rgba(102, 126, 234, 0.2),
            -12px -12px 24px rgba(255, 255, 255, 0.9),
            inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        min-width: 360px;
        max-width: 90vw;
        position: relative;
        overflow: hidden;
    }
    
    body.dark-theme #loading {
        background: linear-gradient(145deg, rgba(26, 26, 46, 0.98), rgba(18, 18, 36, 0.95));
        box-shadow: 
            12px 12px 24px rgba(0, 0, 0, 0.4),
            -12px -12px 24px rgba(255, 255, 255, 0.05),
            inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    }
    
    #loading::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        animation: shimmer 2s infinite;
    }
    
    @keyframes shimmer {
        to {
            left: 100%;
        }
    }
    
    .loading-icon {
        font-size: 5em;
        animation: bounce3d 1.2s ease-in-out infinite;
        filter: drop-shadow(0 10px 20px rgba(102, 126, 234, 0.4));
        position: relative;
        z-index: 1;
    }

    @keyframes bounce3d {
        0%, 100% {
            transform: translateY(0) scale(1) rotateZ(0deg);
        }
        25% {
            transform: translateY(-25px) scale(1.1) rotateZ(-5deg);
        }
        50% {
            transform: translateY(-30px) scale(1.15) rotateZ(0deg);
        }
        75% {
            transform: translateY(-25px) scale(1.1) rotateZ(5deg);
        }
    }
    
    .loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        width: 100%;
    }

    .loading-text {
        font-size: 1.3em;
        font-weight: 600;
        color: #333;
        text-align: center;
    }

    .progress-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .progress-bar-wrapper {
        width: 100%;
        height: 10px;
        background-color: rgba(224, 224, 224, 0.5);
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        box-shadow: 
            inset 3px 3px 6px rgba(0, 0, 0, 0.15),
            inset -3px -3px 6px rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(102, 126, 234, 0.1);
    }
    
    body.dark-theme .progress-bar-wrapper {
        background-color: rgba(42, 42, 78, 0.5);
        box-shadow: 
            inset 3px 3px 6px rgba(0, 0, 0, 0.4),
            inset -3px -3px 6px rgba(255, 255, 255, 0.05);
        border-color: rgba(102, 126, 234, 0.3);
    }

    .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        border-radius: 12px;
        width: 0%;
        transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
    }
    
    .progress-bar-fill::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        animation: progressShimmer 1.5s infinite;
    }
    
    @keyframes progressShimmer {
        0% {
            transform: translateX(-100%);
        }
        100% {
            transform: translateX(100%);
        }
    }
    
    .progress-percentage {
        margin-top: 8px;
        font-size: 0.9em;
        color: #666;
        font-weight: 500;
    }
    
    .loading-spinner {
        border: 4px solid rgba(0, 0, 0, 0.1);
        border-radius: 50%;
        border-top: 4px solid #667eea;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        display: none;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
        0%, 100% {
            opacity: 1;
            transform: scale(1);
        }
        50% {
            opacity: 0.6;
            transform: scale(1.1);
        }
    }

    .loading-dots {
        display: flex;
        gap: 10px;
    }

    .loading-dot {
        width: 12px;
        height: 12px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        border-radius: 50%;
        animation: dotPulse3d 1.4s ease-in-out infinite;
        box-shadow: 
            4px 4px 8px rgba(0, 0, 0, 0.2),
            -4px -4px 8px rgba(255, 255, 255, 0.7),
            inset 1px 1px 2px rgba(255, 255, 255, 0.5);
    }
    
    .loading-warning {
        margin-top: 20px;
        padding: 20px 24px;
        background: linear-gradient(135deg, 
            rgba(255, 235, 59, 0.15) 0%,
            rgba(255, 193, 7, 0.2) 50%,
            rgba(255, 152, 0, 0.15) 100%
        );
        border: 3px solid rgba(255, 193, 7, 0.6);
        border-radius: 16px;
        color: var(--panel-text);
        font-size: 0.9em;
        line-height: 1.8;
        text-align: left;
        box-shadow: 
            0 8px 24px rgba(255, 193, 7, 0.25),
            0 4px 12px rgba(255, 152, 0, 0.15),
            inset 0 2px 4px rgba(255, 255, 255, 0.4),
            inset 0 -2px 4px rgba(255, 193, 7, 0.2);
        animation: warningPulse 3s ease-in-out infinite;
        position: relative;
        overflow: hidden;

    .loading-warning::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;

            transparent,

        );

    @keyframes warningShimmer {
        0% {
            left: -100%;
        }
        50%, 100% {
            left: 100%;
        }
    }
    
    body.dark-theme .loading-warning {
        background: linear-gradient(135deg, 
            rgba(255, 193, 7, 0.12) 0%,

    <script type="module">
      // Load translations and initialize i18n
      (async function() {
        const version = window.APP_VERSION || Date.now();
        
        try {
          const translationsModule = await import(`./src/translations.js?v=${version}`);
          const { getCurrentLanguage, t } = translationsModule;
          
          // Make t function globally available for other scripts
          window.t = t;
          window.getCurrentLanguage = getCurrentLanguage;
          
          // Update UI texts based on current language
          function updateUITexts() {
            const lang = getCurrentLanguage();
            
            // Update all elements with data-i18n attribute
            document.querySelectorAll('[data-i18n]').forEach(el => {
              const key = el.getAttribute('data-i18n');
              const translation = t(key);
              
              // Check if element has HTML content
              if (el.innerHTML.includes('<br>') || el.innerHTML.includes('<strong>')) {
                el.innerHTML = translation;
              } else {
                el.textContent = translation;
              }
            });
            
            // Update page title
            const titleKey = document.querySelector('[data-i18n-title]')?.getAttribute('data-i18n-title');
            if (titleKey) {
              document.title = lang === 'vi' ? 'Game Tuổi Thơ - Đang chơi game' : 'Retro Java Games - Playing Game';
            }
            
            // Update back button with arrow
            const backBtn = document.getElementById('back-btn');
            if (backBtn) {
              backBtn.textContent = '← ' + t('backButton').replace('← ', '');
            }
            
            // Update controls toggle button
            const controlsToggle = document.getElementById('controls-toggle');
            if (controlsToggle) {
              const isOpen = document.getElementById('controls-panel').classList.contains('show');
              controlsToggle.textContent = isOpen ? t('controlsOpen') : t('controlsClose');
            }
          }
          
          // Listen for language changes
          window.addEventListener('languageChanged', updateUITexts);
          
          // Initialize on load
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', updateUITexts);
          } else {
            updateUITexts();
          }
        } catch (error) {
          console.error('Failed to load translations:', error);
        }
      })();
    </script>
    <script>
        // Theme toggle functionality
        const themeToggleRun = document.getElementById('theme-toggle-run');
        const themeIconRun = document.getElementById('theme-icon-run');
        const body = document.body;
        
        // Check for saved theme preference or default to 'light'
        const currentTheme = localStorage.getItem('theme') || 'light';
        
        // Apply saved theme on page load
        if (currentTheme === 'dark') {
            body.classList.add('dark-theme');
            themeIconRun.textContent = '☀️';
        }
        
        // Theme toggle click handler
        themeToggleRun.addEventListener('click', () => {
            body.classList.toggle('dark-theme');
            
            if (body.classList.contains('dark-theme')) {
                themeIconRun.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                themeIconRun.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        });
        
        // Toggle controls panel
        document.getElementById('controls-toggle').addEventListener('click', function() {
            const panel = document.getElementById('controls-panel');
            panel.classList.toggle('show');
            // Use global t function if available
            if (window.t) {
                this.textContent = panel.classList.contains('show') ? window.t('controlsOpen') : window.t('controlsClose');
            } else {
                this.textContent = panel.classList.contains('show') ? '✕ Đóng' : '🎮 Điều khiển';
            }
        });
        
        // Prevent F5 refresh and warn user
        let gameLoaded = false;
        
        window.addEventListener('keydown', function(e) {
            // Prevent F5 (key 116) and Ctrl+R
            if ((e.keyCode === 116) || (e.ctrlKey && e.keyCode === 82)) {
                e.preventDefault();
                if (!gameLoaded) {
                    // Use global t function if available
                    const message = window.t ? window.t('f5WarningLoading') : '⚠️ CẢNH BÁO!\n\nKHÔNG được tải lại trang khi đang load game!\n\nNếu muốn tải lại, hãy:\n1. Nhấn nút "Quay lại" ở góc trên\n2. Chọn lại game từ trang chủ\n\nTải lại trang sẽ khiến game bị crash!';
                    alert(message);
                } else {
                    const message = window.t ? window.t('f5WarningLoaded') : '⚠️ Bạn có chắc muốn tải lại trang?\n\nĐiều này có thể khiến game bị lỗi!\n\nBấm "Quay lại" để về trang chủ an toàn hơn.';
                    if (confirm(message)) {
                        location.reload();
                    }
                }
            }
        });
        
        // Warn before closing/refreshing page
        window.addEventListener('beforeunload', function(e) {
            if (!gameLoaded) {
                e.preventDefault();
                const message = window.t ? window.t('beforeUnloadWarning') : 'Game đang tải. Bạn có chắc muốn rời khỏi trang?';
                e.returnValue = message;
                return e.returnValue;
            }
        });
        
        // Mark game as loaded when display canvas is shown
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                const display = document.getElementById('display');
                const crashNotice = document.getElementById('game-crash-notice');
                
                if (display && display.style.display !== 'none') {
                    gameLoaded = true;
                    observer.disconnect();
                    
                    // Show crash notice after 3 seconds when game is loaded
                    setTimeout(function() {
                        if (crashNotice) {
                            crashNotice.classList.add('show');
                            
                            // Auto hide after 15 seconds
                            setTimeout(function() {
                                crashNotice.style.animation = 'slideUpNotice 0.5s ease-out reverse';
                                setTimeout(function() {
                                    crashNotice.classList.remove('show');
                                    crashNotice.style.animation = '';
                                }, 500);
                            }, 15000);
                        }
                    }, 3000);
                }
            });
        });
        
        const display = document.getElementById('display');
        if (display) {
            observer.observe(display, { attributes: true, attributeFilter: ['style'] });
        }
        
        // Click to dismiss crash notice
        const crashNotice = document.getElementById('game-crash-notice');
        if (crashNotice) {
            crashNotice.addEventListener('click', function() {
                this.style.animation = 'slideUpNotice 0.5s ease-out reverse';
                setTimeout(() => {
                    this.classList.remove('show');
                    this.style.animation = '';
                }, 500);
            });
        }
    </script>
